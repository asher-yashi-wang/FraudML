[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudml"
version = "0.1.0"
description = "Leakage-aware fraud-detection research framework"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "PyYAML>=6.0", "joblib>=1.3"]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.0"]
gnn = ["torch>=2.1", "torch-geometric>=2.4"]
dev = ["pytest>=7.4"]

[project.scripts]
fraudml = "fraudml.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fraudml*"]
